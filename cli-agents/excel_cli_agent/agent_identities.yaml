# cohort, if one is ever run, gets its own label.
#
#   grok-4.6   listed by Forge's /v1/models as tensorblock/grok-4.6
#              (2026-09-20). xAI docs the same day: 500,000-token context, no
#              output limit, reasoning always on (cannot be disabled),
#              reasoning effort low/medium/high/xhigh with high the default;
#              xhigh exists from grok-4.6 on. xhigh is therefore the top
#              tier - the counterpart of fable-5-1-max / gpt-6-astra-xhigh.
#              Live-probed through Forge 2026-09-20 (12 calls): the gateway
#              forwards the top-level reasoning_effort this executor sends
#              (an invalid value 400s at the provider; low vs xhigh = 1.5k vs
#              9-13k reasoning tokens on one puzzle; xAI's own REST examples
#              nest it as reasoning.effort - same result) and accepts the
#              128000 cap. Thinking streams as delta.reasoning_content and is
#              reported OUTSIDE completion_tokens; the executor handles both.
#              One call in twelve took a slower upstream route (no streamed
#              thinking, ~11 tok/s against ~77).
#
# Harness settings match the flagship entries above (128000 cap, fresh
# context, recent_history_count 3).
