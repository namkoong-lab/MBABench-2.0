# GUI cohort `chatgpt_gpt_6_astra_work_ultra` — chatgpt.com, Work surface,
# model "GPT-6 Astra", Power "Ultra", standard speed. The identity label is
# DERIVED from the chatgpt_web axes below by infra/configs/agent_identity.py;
# nothing here names it.
#
# Tasks are read from <data_root>/tasks/ (scripts/download_dataset.py) and every
# attempt is written under <output_root>/attempts/chatgpt_gpt_6_astra_work_ultra/
# (both roots: config/config.yaml local.*, or MBABENCH_DATA_ROOT /
# MBABENCH_OUTPUT_ROOT). Chrome must be running on browser.cdp_port with the
# chatgpt.com login in browser.profile_dir (see the root README); put machine-
# specific values in the gitignored infra/configs/configs.yaml, not here.
#
# Run (from gui-agents/):
#   uv run python -m infra.run --dry-run --run-config infra/configs/run_configs/chatgpt_work_gpt_6_astra_ultra.yaml
#   uv run python -m infra.run -y        --run-config infra/configs/run_configs/chatgpt_work_gpt_6_astra_ultra.yaml
#   uv run python -m infra.run -y --task-id 7 --run-config ...     # one task
# Re-running resumes: skip_already_attempted skips every task that already has
# a successful row in attempts/chatgpt_gpt_6_astra_work_ultra/task_attempts.jsonl.

source:
  kind: bundle                       # <data_root>/tasks/task_id=<N>/task.json
  filters:
    task_ids: []                     # [] = every task present (1-101); or e.g. [1, 2, 3]
    skip_already_attempted: true     # resume: successful local rows are skipped

sink:
  kind: local                        # <output_root>/attempts/<label>/task_id=<N>/<ts>/ + task_attempts.jsonl

# House Standards single-pass prompt (tasks_configs/prompts/v2_3.txt) with
# ../house_standards/House_Standards_v1.md uploaded after the case files —
# both selected by the version. 0 = the cheap plumbing smoke-test prompt.
prompt_version: 205

provider:
  kind: "chatgpt"

chatgpt_web:
  project_id: null                   # no project scope
  project_slug: null
  mode: "work"                       # work surface (slider picker)
  model: "gpt_6_astra"               # model radio "GPT-6 Astra"
  effort: "ultra"                    # Power ladder: Ultra (top stop)
  speed: "standard"                  # standard speed (the UI default)
  intelligence: null                 # chat-mode axis; unused in work mode
