# Prompt-version registry — maps `prompt_version` to the prompt file(s) sent.
#
# WHY THIS EXISTS
# The version is the single key that selects the text, so the number written
# to task_attempts.prompt_version and the prompt the agent received are the
# same decision and cannot disagree.
#
# HOW IT IS USED
# infra/configs/prompt_registry.py reads this file; infra/run.py resolves the
# run's `prompt_version` through it and hands the resulting files to the
# engine. A run config sets `prompt_version` and nothing else — there is no
# other way to choose the text. New text = a new entry here.
#
# ONE VERSION, ONE PROMPT SET. Every entry names exactly one `files` list.
# Paths are repo-root-relative (repo root = gui-agents/) and are sent to the
# agent IN ORDER, one chat turn each; a single-element list is a single-turn
# prompt. `attachments` are resolved the same way (`../house_standards/...`
# reaches the repository root).
#
# ADDING A VERSION
# Add an entry; never edit an existing one. A version that has been used for
# a real run is immutable — rows in task_attempts already point at it, and
# rewriting the text under a live number silently invalidates that history.
# New text = new number.
#
# NUMBERING
#   0, 1     infrastructure smoke tests — not benchmark prompts. Rows they
#            produce are throwaway (1 = 0 + the house-standards attachment).
#   2xx      the benchmark prompt sets (200-203 rubric-v9, 204-205 House
#            Standards).

versions:

  0:
    label: "000 pipeline smoke test"
    description: >
      NOT a benchmark prompt. One turn asking the agent to return the
      attached workbook unchanged plus a single extra sheet named
      "TEST SHEET" holding a large bold "TEST" in A1.

      Exists to exercise the whole path — upload, chat turn, download,
      file validation, the attempt record — in seconds and without spending
      reasoning on a case, and to give a solution file whose correctness
      is checkable by eye. Never grade a run recorded under this version.

      Written `0` here; a run config may set `prompt_version: 000` or `0`
      (YAML reads both as the integer 0).
    files:
      - "tasks_configs/prompts/v000_test.txt"

  1:
    label: "001 pipeline smoke test + House Standards attachment"
    description: >
      NOT a benchmark prompt. Version 0's one-turn plumbing prompt with the
      House_Standards_v1.md attachment declared, so the attachment path
      (resolve -> upload after the case files -> attachment wait -> prompts
      JSON record) is exercised in seconds on a live provider without
      spending a real task. Added 2026-09-10 for the 101-task rerun ladder;
      the agent is told to ignore the case and the standards alike. Never
      grade a run recorded under this version.
    files:
      - "tasks_configs/prompts/v000_test.txt"
    attachments:
      - "../house_standards/House_Standards_v1.md"

  200:
    label: "rubric-v9 3-step"
    description: >
      Three prompts, one chat turn each: analyze & plan (Summary sheet) ->
      build (embeds the full 132-check rubric) -> QA & download. These are
      the files the repo default has always sent, now under a number that
      means only this.
    files:
      - "tasks_configs/prompts_v2/step1_analyze.txt"
      - "tasks_configs/prompts_v2/step2_build.txt"
      - "tasks_configs/prompts_v2/step3_qa.txt"

  201:
    label: "rubric-v9 single-pass"
    description: >
      All three deliverables (Summary -> model -> Answers) plus the step-3 QA
      checklist folded into ONE chat turn. The rubric body is byte-identical
      to step2_build.txt from its `== FULL RUBRIC ==` marker onward, so
      scores stay comparable to version 200 and any delta is attributable to
      turn structure alone. ~67k chars: expect the output cap to be hit
      mid-build and the agent's truncation-continue loop to resume it.
    files:
      - "tasks_configs/prompts/v2_1.txt"

  202:
    label: "rubric-v9 3-step + Questions-sheet answers"
    description: >
      Version 200 with one addition: the starting workbook's 'Questions'
      sheet (questions in column A from A2, reserved answer cells in the
      column headed 'Answers' — B in most tasks, C in a few, from row 2
      down — units in the 'Unit' column, answer-format instructions in
      the header row) must be preserved — same name, same rows — and answered
      with live formulas referencing the model. Same three chat turns; the
      132-check rubric body is byte-identical to version 200's, so any
      score delta is attributable to the answer-placement instruction
      alone. Generated from prompts_v2/ — see prompts_v3/README.md.
    files:
      - "tasks_configs/prompts_v3/step1_analyze.txt"
      - "tasks_configs/prompts_v3/step2_build.txt"
      - "tasks_configs/prompts_v3/step3_qa.txt"

  203:
    label: "rubric-v9 single-pass + Questions-sheet answers"
    description: >
      Version 201 with the same Questions-sheet addition as 202: the
      created-'Answers'-sheet deliverable is replaced by filling the
      starting workbook's 'Questions' sheet (live formulas in the
      'Answers' column from row 2 down; sheet preserved under its exact
      name), and the QA
      checklist gains the matching item 8. One chat turn; rubric body
      byte-identical to step2_build.txt's from the `== FULL RUBRIC ==`
      marker onward, unchanged from 200/201. Same ~67k-char
      truncation-continue caveat as 201.
    files:
      - "tasks_configs/prompts/v2_2.txt"

  204:
    label: "House Standards 3-step (rubric-free) + Questions-sheet answers"
    description: >
      The House Standards prompt set, three turns. Generated from the frozen
      202 sources (prompts_v3/) by tools/build_house_standards_prompts.py:
      every rubric passage is REMOVED (the graded-against paragraph and
      category weights, the professional-services conventions summary, the
      132-check rubric block, and the rubric-derived QA audit list, replaced
      by a neutral verify-and-deliver step) and the house standards are
      added instead - a read-it-now sentence in step 1, a HOUSE STANDARDS
      block in step 2, and a "follows House_Standards_v1.md" check in step 3.
      The file itself is declared under `attachments` and is uploaded with
      the case files on every run of this version - the version selects the
      text AND the attachment. Same design as the coding pipeline's
      rubric-scrubbed v10/v11 templates (maintainer, 2026-09-10). The
      Questions-sheet answer mechanics are unchanged from 202.
      (Cut 2026-09-10 as "202 + house standards, rubric untouched" and
      redefined the same day before any 204 run was recorded.)
    files:
      - "tasks_configs/prompts_v4/step1_analyze.txt"
      - "tasks_configs/prompts_v4/step2_build.txt"
      - "tasks_configs/prompts_v4/step3_qa.txt"
    attachments:
      - "../house_standards/House_Standards_v1.md"

  205:
    label: "House Standards single-pass (rubric-free) + Questions-sheet answers"
    description: >
      The House Standards prompt, one turn: the same removals and additions
      as 204 applied to the frozen 203 text (prompts/v2_2.txt) by
      tools/build_house_standards_prompts.py - no rubric material at all,
      a HOUSE STANDARDS block after the Questions item, and a neutral
      VERIFY AND DELIVER step in place of the rubric-derived QA list. The
      attachment is the same House_Standards_v1.md. The repo default.
      (Cut 2026-09-10 as "203 + house standards, rubric untouched";
      redefined the same day - the two attempts recorded under that text,
      1239 and 1240, are deprecated.)
    files:
      - "tasks_configs/prompts/v2_3.txt"
    attachments:
      - "../house_standards/House_Standards_v1.md"
