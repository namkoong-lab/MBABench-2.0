# codex_openai/gpt-5.6-sol-xhigh — vendor API direct
# Codex CLI driving gpt-5.6-sol at effort xhigh, vendor API direct.
# Needs keys.openai_api_key in config/config.yaml (or the env var), Docker, and the sandbox
# image (docker build -t mbabench-coding-agent:v2 docker/).
#
#   cd coding-agents
#   uv run python -m coding_agent.run_sweep --config run_configs/gpt_5.6_sol_xhigh.yaml --dry-run
#   uv run python -m coding_agent.run_sweep --config run_configs/gpt_5.6_sol_xhigh.yaml
#
# --task-ids 1,5,9-12 narrows the range below; a relaunch skips tasks that
# already have a non-failed row for this label.

agent_model_name: codex_openai/gpt-5.6-sol-xhigh
template_version: v13

tasks:
  first: 1
  last: 101

sandbox:
  image: mbabench-coding-agent:v2

# limits:
#   junk_seconds: 180   # hold successes faster than this as needs_review (default 0 = off)
