# codex_tensorblock/claude-fable-5-1-max — route example: the same model through TensorBlock Forge; Claude Code cannot be pointed at a gateway, so this route runs Codex instead.
# Codex CLI driving tensorblock/claude-fable-5-1 at effort max, through TensorBlock Forge via the sandbox relay.
# Needs keys.forge_api_key in config/config.yaml (or the env var), Docker, and the sandbox
# image (docker build -t mbabench-coding-agent:v2 docker/).
#
#   cd coding-agents
#   uv run python -m coding_agent.run_sweep --config run_configs/routes/claude_fable_5_1_max_via_forge.yaml --dry-run
#   uv run python -m coding_agent.run_sweep --config run_configs/routes/claude_fable_5_1_max_via_forge.yaml
#
# --task-ids 1,5,9-12 narrows the range below; a relaunch skips tasks that
# already have a non-failed row for this label.

agent_model_name: codex_tensorblock/claude-fable-5-1-max
template_version: v13

tasks:
  first: 1
  last: 101

sandbox:
  image: mbabench-coding-agent:v2

# limits:
#   junk_seconds: 180   # hold successes faster than this as needs_review (default 0 = off)
