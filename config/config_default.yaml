# config_default.yaml — committed defaults. Do not edit this file.
#
# The first load creates config/config.yaml (gitignored) next to it from these
# defaults; put your settings there. Secrets are never in the committed file:
# `${env:VAR}` resolves from your shell at load time, or write the value into
# config/config.yaml directly.

# Where the benchmark lives and where runs write. Relative paths resolve
# against the repository root. MBABENCH_DATA_ROOT / MBABENCH_OUTPUT_ROOT in the
# environment override both.
local:
  data_root: "data"        # filled by `scripts/download_dataset.py`
  output_root: "outputs"   # attempts/<agent_model_name>/... and gradings/

# Model-provider keys. Set only the ones you use:
#   CLI pipeline     the provider of the agent_model_name you run
#   coding pipeline  ANTHROPIC_API_KEY (Claude Code) or OPENAI_API_KEY (Codex)
#   judge            OPENAI_API_KEY for the default grader (openai/gpt-5.6-sol)
#   GUI / Excel      none (a signed-in browser instead)
keys:
  anthropic_api_key: "${env:ANTHROPIC_API_KEY}"
  openai_api_key: "${env:OPENAI_API_KEY}"
  openrouter_api_key: "${env:OPENROUTER_API_KEY}"
  gemini_api_key: "${env:GEMINI_API_KEY}"
  forge_api_key: "${env:FORGE_API_KEY}"     # TensorBlock Forge gateway (tensorblock/* labels)

# Where setup.sh creates the environment. null = <repo>/.venv
venv_path: null

# The LibreOffice binary (soffice) for formula recalculation and the judge's
# deterministic checks. null = auto-detect (PATH, then the macOS app bundle).
libreoffice_path: null
